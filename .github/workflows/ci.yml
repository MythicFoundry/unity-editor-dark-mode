name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC toolchain
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Build project
      run: cmake -B build && cmake --build build --config Release

    - name: Test auxiliary-thread dialog theming
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Test Unity bootstrap compatibility
      shell: pwsh
      run: ./tests/Test-BootstrapCompatibility.ps1

    - name: Validate UPM package
      shell: pwsh
      run: ./scripts/Test-UpmPackage.ps1

    - name: Stage Unity 2017 legacy Assets package
      shell: pwsh
      run: ./scripts/Stage-LegacyAssetsPackage.ps1

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4.3.1
      with:
        name: ci-build
        path: |
          build/Release
          build/LegacyAssetsPackage
        retention-days: 14
